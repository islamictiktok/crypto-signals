name: Daily Quant AI Training

on:
  schedule:
    - cron: '0 0 * * *' # سيعمل يومياً منتصف الليل
  workflow_dispatch:

jobs:
  train-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Heavy Dependencies
        run: pip install pandas ccxt pandas-ta stable-baselines3 gymnasium onnx onnxscript torch

      - name: Run AI Training
        run: python train.py

      - name: Commit Updated Brains
        run: |
          git config --global user.name "AI-Quant-Bot"
          git config --global user.email "bot@quant.com"
          git add btc_deep_quant_pro.zip btc_ai_model.onnx
          git commit -m "🤖 MLOps: Daily Brain Update" || echo "No changes"
          git push
